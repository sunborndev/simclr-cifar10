<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>

  <text x="50" y="38" font-size="21" font-weight="700" fill="#0f172a">Répartition des données — CIFAR-10</text>
  <text x="50" y="60" font-size="13" fill="#475569">Ce que voit chaque modèle, et ce qu'on lui cache volontairement</text>

  <!-- ===== NIVEAU 1 : le jeu complet ===== -->
  <text x="50" y="96" font-size="12" font-weight="600" fill="#64748b">1. LE JEU COMPLET, TEL QUE LIVRÉ</text>
  <rect x="50" y="106" width="900" height="46" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="500" y="135" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">CIFAR-10 — 60 000 images de 32 × 32 pixels, 10 classes</text>

  <path d="M 425 152 L 425 166 M 875 152 L 875 166" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ===== NIVEAU 2 : train / test ===== -->
  <text x="50" y="188" font-size="12" font-weight="600" fill="#64748b">2. DÉCOUPAGE IMPOSÉ PAR LES CRÉATEURS DU JEU — on ne le modifie jamais</text>
  <rect x="50" y="198" width="750" height="52" rx="4" fill="#1e3a8a"/>
  <text x="425" y="220" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">TRAIN OFFICIEL — 50 000 images</text>
  <text x="425" y="239" font-size="11.5" fill="#c7d2fe" text-anchor="middle">c'est le seul paquet auquel nous touchons</text>

  <rect x="800" y="198" width="150" height="52" rx="4" fill="#334155"/>
  <text x="875" y="217" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TEST OFFICIEL</text>
  <text x="875" y="233" font-size="12" fill="#cbd5e1" text-anchor="middle">10 000</text>
  <text x="875" y="246" font-size="10.5" fill="#fca5a5" text-anchor="middle">scellé jusqu'à la fin</text>

  <path d="M 375 250 L 375 264 M 762 250 L 762 264" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ===== NIVEAU 3 : pool / validation ===== -->
  <text x="50" y="286" font-size="12" font-weight="600" fill="#64748b">3. NOTRE DÉCOUPAGE DU TRAIN — stratifié, graine 7, identique pour toutes les expériences</text>
  <rect x="50" y="296" width="675" height="52" rx="4" fill="#2563eb"/>
  <text x="387" y="318" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">RÉSERVE ÉTIQUETABLE — 45 000 images</text>
  <text x="387" y="337" font-size="11.5" fill="#dbeafe" text-anchor="middle">c'est ici, et seulement ici, qu'on pioche les labels</text>

  <rect x="725" y="296" width="75" height="52" rx="4" fill="#b45309"/>
  <text x="762" y="315" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">VALIDATION</text>
  <text x="762" y="331" font-size="12" fill="#fed7aa" text-anchor="middle">5 000</text>
  <text x="762" y="344" font-size="9.5" fill="#fed7aa" text-anchor="middle">examen blanc</text>

  <!-- ===== NIVEAU 4 : les trois scenarios ===== -->
  <text x="50" y="392" font-size="12" font-weight="600" fill="#64748b">4. LES TROIS SCÉNARIOS — on découpe la réserve de 45 000, jamais la validation ni le test</text>

  <!-- ligne 1 % -->
  <text x="50" y="424" font-size="12.5" font-weight="700" fill="#0f172a">1 %</text>
  <rect x="95" y="410" width="675" height="30" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
  <rect x="95" y="410" width="7" height="30" rx="1" fill="#15803d"/>
  <path d="M 98 410 L 98 396 L 150 396" stroke="#15803d" stroke-width="1.5" fill="none"/>
  <text x="156" y="400" font-size="11" font-weight="700" fill="#15803d">450 étiquetées</text>
  <text x="440" y="429" font-size="11.5" fill="#64748b" text-anchor="middle">44 550 images dont on jette la réponse</text>
  <text x="790" y="429" font-size="11" fill="#475569">= 450 réponses écrites</text>

  <!-- ligne 10 % -->
  <text x="50" y="474" font-size="12.5" font-weight="700" fill="#0f172a">10 %</text>
  <rect x="95" y="460" width="675" height="30" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
  <rect x="95" y="460" width="67" height="30" rx="2" fill="#15803d"/>
  <text x="128" y="479" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4 500</text>
  <text x="466" y="479" font-size="11.5" fill="#64748b" text-anchor="middle">40 500 images dont on jette la réponse</text>
  <text x="790" y="479" font-size="11" fill="#475569">= 4 500 réponses écrites</text>

  <!-- ligne 100 % -->
  <text x="50" y="524" font-size="12.5" font-weight="700" fill="#0f172a">100 %</text>
  <rect x="95" y="510" width="675" height="30" rx="3" fill="#15803d"/>
  <text x="432" y="529" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">45 000 étiquetées — aucune réponse jetée</text>
  <text x="790" y="529" font-size="11" fill="#475569">= 45 000 réponses écrites</text>

  <!-- legende -->
  <rect x="95" y="556" width="13" height="13" rx="2" fill="#15803d"/>
  <text x="114" y="567" font-size="11" fill="#334155">image + sa réponse données au modèle</text>
  <rect x="360" y="556" width="13" height="13" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="379" y="567" font-size="11" fill="#334155">réponse volontairement jetée — le modèle ne voit pas cette image</text>

  <!-- ===== ENCADRE CLE ===== -->
  <rect x="50" y="590" width="900" height="88" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="70" y="614" font-size="13" font-weight="700" fill="#14532d">Le point qui fait tout le projet</text>
  <text x="70" y="636" font-size="12" fill="#166534">Les images grises, l'élève parti de zéro ne les verra jamais. Le modèle préentraîné par SimCLR, lui, les a</text>
  <text x="70" y="654" font-size="12" fill="#166534">toutes regardées — sans jamais connaître leur réponse, puisque le préentraînement n'utilise aucun label.</text>
  <text x="70" y="672" font-size="12" fill="#166534">C'est la situation du monde réel : des images, on en a des millions ; des images étiquetées à la main, très peu.</text>
</svg>
