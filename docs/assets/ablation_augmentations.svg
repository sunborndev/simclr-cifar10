<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="760" fill="#ffffff"/>

  <text x="40" y="34" font-size="19.5" font-weight="700" fill="#0f172a">Ce sont les augmentations de couleur qui portent tout le travail</text>
  <text x="40" y="55" font-size="12" fill="#475569">Ablation additive : une seule brique ajoutée à la fois. Architecture, 100 époques, lot 256, AdamW 3e-4, température 0,5, graine 42 — tout le reste identique.</text>
  <text x="40" y="72" font-size="12" fill="#475569">Accuracy d'évaluation linéaire sur les 10 000 images de test, encodeur gelé, 100 % des labels, moyenne de 3 graines de probe.</text>

  <!-- ===== PANNEAU 1 : barres d'accuracy ===== -->
  <text x="40" y="106" font-size="12.5" font-weight="700" fill="#15803d">CRITÈRE DE CLASSEMENT — accuracy de l'évaluation linéaire</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="380" y1="118" x2="380" y2="356"/><line x1="500" y1="118" x2="500" y2="356"/>
    <line x1="620" y1="118" x2="620" y2="356"/><line x1="740" y1="118" x2="740" y2="356"/>
  </g>
  <line x1="260" y1="118" x2="260" y2="356" stroke="#94a3b8" stroke-width="1.5"/>
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="260" y="370">0</text><text x="380" y="370">20 %</text><text x="500" y="370">40 %</text>
    <text x="620" y="370">60 %</text><text x="740" y="370">80 %</text>
  </g>

  <!-- crop -->
  <text x="252" y="159" font-size="12" font-weight="700" fill="#334155" text-anchor="end">crop</text>
  <text x="252" y="172" font-size="9.5" fill="#94a3b8" text-anchor="end">recadrage seul</text>
  <rect x="260" y="140" width="360" height="28" rx="2" fill="#94a3b8"/>
  <text x="630" y="159" font-size="12" font-weight="700" fill="#475569">59,99 %</text>

  <!-- crop_flip -->
  <text x="252" y="205" font-size="12" font-weight="700" fill="#334155" text-anchor="end">crop + flip</text>
  <text x="252" y="218" font-size="9.5" fill="#94a3b8" text-anchor="end">+ retournement</text>
  <rect x="260" y="186" width="356" height="28" rx="2" fill="#94a3b8"/>
  <text x="626" y="205" font-size="12" font-weight="700" fill="#475569">59,33 %</text>

  <!-- crop_flip_jitter -->
  <text x="252" y="251" font-size="12" font-weight="700" fill="#334155" text-anchor="end">+ color jitter</text>
  <text x="252" y="264" font-size="9.5" fill="#b45309" text-anchor="end">perturbation des couleurs</text>
  <rect x="260" y="232" width="437" height="28" rx="2" fill="#0e7490"/>
  <text x="707" y="251" font-size="12" font-weight="700" fill="#0e7490">72,79 %</text>

  <!-- complet -->
  <text x="252" y="297" font-size="12" font-weight="700" fill="#334155" text-anchor="end">+ niveaux de gris</text>
  <text x="252" y="310" font-size="9.5" fill="#15803d" text-anchor="end">= configuration complète</text>
  <rect x="260" y="278" width="491" height="28" rx="2" fill="#15803d"/>
  <text x="761" y="297" font-size="12.5" font-weight="700" fill="#15803d">81,87 %</text>

  <!-- complet_flou -->
  <text x="252" y="343" font-size="12" font-weight="700" fill="#334155" text-anchor="end">+ flou gaussien</text>
  <rect x="260" y="324" width="489" height="28" rx="2" fill="#15803d" opacity="0.55"/>
  <text x="759" y="343" font-size="12" font-weight="700" fill="#15803d">81,56 %</text>

  <!-- annotations des sauts -->
  <path d="M 800 200 L 812 200 L 812 246 L 800 246" stroke="#b45309" stroke-width="1.8" fill="none"/>
  <rect x="818" y="211" width="100" height="24" rx="12" fill="#b45309"/>
  <text x="868" y="228" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">+13,46 pt</text>

  <path d="M 800 246 L 812 246 L 812 292 L 800 292" stroke="#b45309" stroke-width="1.8" fill="none"/>
  <rect x="818" y="257" width="100" height="24" rx="12" fill="#b45309"/>
  <text x="868" y="274" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">+9,08 pt</text>

  <text x="800" y="159" font-size="10.5" fill="#94a3b8">flip :</text>
  <text x="800" y="172" font-size="10.5" font-weight="700" fill="#94a3b8">aucun effet</text>
  <text x="800" y="337" font-size="10.5" fill="#94a3b8">flou :</text>
  <text x="800" y="350" font-size="10.5" font-weight="700" fill="#94a3b8">aucun effet</text>

  <rect x="40" y="386" width="880" height="36" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="54" y="402" font-size="11.5" font-weight="700" fill="#92400e">Les deux briques de couleur apportent +22,54 points à elles seules — la quasi-totalité de l'écart entre la pire et la meilleure configuration.</text>
  <text x="54" y="416" font-size="11" fill="#92400e">La géométrie au-delà du recadrage (retournement) et le flou n'ont aucun effet mesurable sur ce protocole.</text>

  <!-- ===== PANNEAU 2 : l'inversion ===== -->
  <text x="40" y="454" font-size="12.5" font-weight="700" fill="#b91c1c">LE PIÈGE — la perte contrastive classe les configurations À L'ENVERS</text>

  <line x1="330" y1="470" x2="330" y2="632" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="330" y1="632" x2="790" y2="632" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="560" y="656" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">Perte NT-Xent finale du préentraînement  →  (plus basse = tâche prétexte mieux résolue)</text>
  <text x="312" y="551" font-size="11.5" font-weight="600" fill="#334155" transform="rotate(-90 312 551)" text-anchor="middle">Accuracy linéaire</text>

  <!-- tendance -->
  <line x1="359" y1="608" x2="749" y2="479" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5" opacity="0.55"/>

  <g>
    <circle cx="359.1" cy="608.1" r="7" fill="#94a3b8"/>
    <text x="359" y="627" font-size="10" fill="#475569" text-anchor="middle">crop</text>
    <text x="359" y="597" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">60,0 %</text>

    <circle cx="372.3" cy="612.0" r="7" fill="#94a3b8"/>

    <circle cx="555.0" cy="531.3" r="7" fill="#0e7490"/>
    <text x="555" y="550" font-size="10" fill="#0e7490" text-anchor="middle">+ jitter</text>
    <text x="555" y="521" font-size="10" font-weight="700" fill="#0e7490" text-anchor="middle">72,8 %</text>

    <circle cx="728.5" cy="476.8" r="8" fill="#15803d"/>
    <text x="728" y="466" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">complet — 81,9 %</text>

    <circle cx="749.2" cy="478.6" r="7" fill="#15803d" opacity="0.55"/>
  </g>

  <text x="392" y="600" font-size="10.5" font-weight="700" fill="#b91c1c">98 % des positifs au premier rang</text>
  <text x="392" y="614" font-size="10.5" fill="#b91c1c">— et la pire représentation</text>

  <rect x="40" y="676" width="880" height="66" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="54" y="696" font-size="12" font-weight="700" fill="#7f1d1d">Corrélation de rang entre perte et accuracy : ρ = +0,80. La perte monte quand la représentation s'améliore.</text>
  <text x="54" y="714" font-size="11.5" fill="#7f1d1d">Sans perturbation des couleurs, les deux vues d'une image gardent les mêmes teintes : le modèle apparie les vues en comparant leurs histogrammes de</text>
  <text x="54" y="731" font-size="11.5" fill="#7f1d1d">couleur, sans jamais regarder la forme. Tâche facile, perte basse, représentation pauvre. On classe donc par l'accuracy aval, jamais par la perte.</text>
</svg>
